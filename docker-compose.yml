# IronNote — three services, no orchestration layer.
#
# Security posture for a host with a public IP:
#   * only the frontend publishes a port, and it binds to 127.0.0.1 by default,
#     so nothing is reachable from the internet until you put TLS in front;
#   * postgres and the API are unreachable from outside the compose network;
#   * the API trusts X-Forwarded-For only from the compose subnet.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ironnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ironnote}
      LANG: C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ironnote}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ironnote}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      IRONNOTE_ADMIN_USERNAME: ${IRONNOTE_ADMIN_USERNAME:-admin}
      IRONNOTE_ADMIN_PASSWORD: ${IRONNOTE_ADMIN_PASSWORD:?IRONNOTE_ADMIN_PASSWORD is required}
      IRONNOTE_REQUIRE_STRONG_ADMIN_PASSWORD: ${IRONNOTE_REQUIRE_STRONG_ADMIN_PASSWORD:-true}
      IRONNOTE_COOKIE_SECURE: ${IRONNOTE_COOKIE_SECURE:-false}
      IRONNOTE_PUBLIC_ORIGIN: ${IRONNOTE_PUBLIC_ORIGIN:-}
      IRONNOTE_TRUSTED_PROXIES: ${IRONNOTE_TRUSTED_PROXIES:-172.16.0.0/12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # Defence in depth: a container compromise should not be able to escalate.
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback by default: publish through your TLS proxy, not directly.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks: [internal]

volumes:
  postgres-data:

networks:
  internal:
