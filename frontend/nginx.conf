# Static UI plus a reverse proxy to the API, so the browser sees one origin and no
# CORS configuration is needed in production.
#
# Security headers live here as well as in the Go service: the UI is served by
# nginx, so this is the layer that protects the page itself.

server_tokens off;

# Basic abuse protection at the edge. The API has its own limiter; this one keeps
# obvious floods from consuming worker connections.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # The API container is reachable by its compose service name.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP for the SPA: no inline scripts or styles, no third-party origins. Vite
    # emits hashed external assets and Tailwind writes a stylesheet, so nothing
    # legitimate needs 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # HSTS is only meaningful over TLS. Uncomment when a TLS proxy fronts this
    # container and IRONNOTE_COOKIE_SECURE=true.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn conn_zone 20;

    # Hashed assets are immutable; do not consult the network on every load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Login is the most attacked endpoint: cap it hard at the edge too.
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz-api {
        access_log off;
        proxy_pass $backend/healthz;
    }

    # Client-side routes: every unknown path is the SPA shell, not a 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
