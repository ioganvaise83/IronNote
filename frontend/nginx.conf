# Static UI plus a reverse proxy to the API, so the browser sees one origin and
# no CORS configuration is needed in production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API container is reachable by its compose service name.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; do not consult the network on every load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz-api {
        access_log off;
        proxy_pass $backend/healthz;
    }

    # Client-side routes: every unknown path is the SPA shell, not a 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
