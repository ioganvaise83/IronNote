version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_json_tags: false
        overrides:
          - db_type: "numeric"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Numeric"
